<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JNR Manager – 9K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0612;
    --surface: rgba(255,255,255,0.06);
    --surface2: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.12);
    --border2: rgba(255,255,255,0.20);
    --purple: #7c3aed;
    --purple2: #a855f7;
    --green: #22c55e;
    --red: #ef4444;
    --gold: #f59e0b;
    --text: #ffffff;
    --text2: rgba(255,255,255,0.55);
    --text3: rgba(255,255,255,0.30);
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.15);
    --blur: blur(24px) saturate(180%);
    --radius: 20px;
    --radius-sm: 14px;
    --tab-h: 72px;
    --header-h: 56px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; width:100%; overflow:hidden; background:var(--bg); font-family:'Nunito',sans-serif; color:var(--text); }

  /* Background */
  #bg-mesh {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124,58,237,0.35) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(168,85,247,0.20) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 60% 30%, rgba(99,102,241,0.15) 0%, transparent 50%),
                #0a0612;
  }
  #bg-mesh::after {
    content:''; position:absolute; inset:0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity:.4;
  }

  /* App shell */
  #app { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; overflow:hidden; }

  /* Header */
  #header {
    height:var(--header-h); flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    background: rgba(10,6,18,0.7);
    backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--border);
    position:relative; z-index:100;
  }
  .header-logo { font-size:20px; font-weight:900; letter-spacing:-0.5px;
    background: linear-gradient(135deg,#fff 0%,#a78bfa 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .header-badge {
    background: linear-gradient(135deg,#22c55e,#16a34a);
    border-radius:100px; padding:4px 12px; font-size:13px; font-weight:800;
    color:#fff; box-shadow:0 0 16px rgba(34,197,94,0.4);
  }
  .header-notif { font-size:20px; cursor:pointer; }

  /* Tabs nav */
  #tabs-nav {
    height:52px; flex-shrink:0;
    display:flex; align-items:center; gap:6px; padding:0 12px;
    overflow-x:auto; scrollbar-width:none;
    background: rgba(10,6,18,0.5);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  #tabs-nav::-webkit-scrollbar { display:none; }
  .tab-btn {
    flex-shrink:0; height:34px; padding:0 14px; border-radius:100px;
    border:1px solid var(--border); background:transparent;
    color:var(--text2); font-size:13px; font-weight:700; cursor:pointer;
    transition:all .2s; white-space:nowrap; font-family:inherit;
    display:flex; align-items:center; gap:6px;
  }
  .tab-btn.active {
    background: linear-gradient(135deg,var(--purple),var(--purple2));
    border-color:transparent; color:#fff;
    box-shadow:0 0 20px rgba(124,58,237,0.5);
  }
  .tab-btn:not(.active):active { background:var(--surface); }

  /* Page content */
  #pages { flex:1; overflow:hidden; position:relative; }
  .page { position:absolute; inset:0; overflow-y:auto; scrollbar-width:none; padding:16px 14px 90px; display:none; }
  .page::-webkit-scrollbar { display:none; }
  .page.active { display:block; }

  /* Bottom nav */
  #bottom-nav {
    height:var(--tab-h); flex-shrink:0;
    display:flex; align-items:center;
    background: rgba(10,6,18,0.85);
    backdrop-filter: var(--blur);
    border-top:1px solid var(--border);
    padding:0 4px;
  }
  .nav-item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 4px; cursor:pointer; border:none; background:none;
    color:var(--text3); transition:all .2s; font-family:inherit;
    border-radius:16px; margin:4px 2px;
  }
  .nav-item.active { color:var(--purple2); }
  .nav-item .nav-icon { font-size:22px; transition:transform .2s; }
  .nav-item.active .nav-icon { transform:scale(1.15); }
  .nav-item .nav-label { font-size:10px; font-weight:700; letter-spacing:0.3px; }

  /* Glass card */
  .glass-card {
    background: var(--glass);
    backdrop-filter: var(--blur);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    position:relative; overflow:hidden;
  }
  .glass-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

  /* Section title */
  .section-title { font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--text3); text-transform:uppercase; margin-bottom:10px; }

  /* Big stat */
  .big-stat { font-size:38px; font-weight:900; letter-spacing:-1.5px; line-height:1; }
  .big-stat.green { color:var(--green); text-shadow:0 0 30px rgba(34,197,94,0.4); }
  .big-stat.red { color:var(--red); text-shadow:0 0 30px rgba(239,68,68,0.4); }
  .big-stat.gold { color:var(--gold); text-shadow:0 0 30px rgba(245,158,11,0.4); }
  .stat-sub { color:var(--text2); font-size:13px; font-weight:600; margin-top:4px; }

  /* Stat grid */
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat-tile {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px; display:flex; flex-direction:column; gap:4px;
  }
  .stat-tile .val { font-size:22px; font-weight:900; }
  .stat-tile .lbl { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text3); }

  /* Member chips */
  .members-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .member-chip {
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:100px;
    padding:6px 12px 6px 6px; cursor:pointer; transition:all .2s;
  }
  .member-chip.active { border-color:var(--purple2); background:rgba(124,58,237,0.2); }
  .member-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; flex-shrink:0; }
  .member-chip .name { font-size:13px; font-weight:700; }

  /* List items */
  .list-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer;
    transition:all .2s;
  }
  .list-item:active { background:var(--surface2); }
  .list-item .li-left { display:flex; flex-direction:column; gap:3px; }
  .list-item .li-title { font-size:14px; font-weight:700; }
  .list-item .li-sub { font-size:12px; color:var(--text2); }
  .list-item .li-right { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .list-item .li-amount { font-size:16px; font-weight:800; }
  .list-item .li-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:100px; }
  .badge-green { background:rgba(34,197,94,0.2); color:var(--green); border:1px solid rgba(34,197,94,0.3); }
  .badge-orange { background:rgba(245,158,11,0.2); color:var(--gold); border:1px solid rgba(245,158,11,0.3); }
  .badge-red { background:rgba(239,68,68,0.2); color:var(--red); border:1px solid rgba(239,68,68,0.3); }
  .badge-purple { background:rgba(168,85,247,0.2); color:var(--purple2); border:1px solid rgba(168,85,247,0.3); }

  /* Flavors grid */
  .flavors-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .flavor-tile {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 12px; display:flex; flex-direction:column; gap:6px; cursor:pointer; transition:all .2s;
  }
  .flavor-tile:active { background:var(--surface2); transform:scale(0.98); }
  .flavor-name { font-size:12px; font-weight:800; line-height:1.2; }
  .flavor-stock { display:flex; align-items:center; justify-content:space-between; }
  .stock-num { font-size:20px; font-weight:900; }
  .stock-num.low { color:var(--red); }
  .stock-num.ok { color:var(--green); }
  .stock-num.mid { color:var(--gold); }

  /* FAB */
  .fab {
    position:fixed; right:20px; z-index:200;
    width:56px; height:56px; border-radius:50%;
    background: linear-gradient(135deg,var(--purple),var(--purple2));
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#fff; box-shadow:0 4px 24px rgba(124,58,237,0.6);
    transition:all .2s;
  }
  .fab:active { transform:scale(0.92); }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0; z-index:300; display:flex; align-items:flex-end;
    background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal {
    width:100%; max-height:92vh; overflow-y:auto;
    background: linear-gradient(180deg, rgba(30,15,55,0.98) 0%, rgba(10,6,18,0.98) 100%);
    backdrop-filter:var(--blur);
    border-radius:28px 28px 0 0;
    border-top:1px solid var(--border2);
    padding:8px 16px
